<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="100%" preserveAspectRatio="xMidYMid meet">

  <!-- Kicker -->
  <text x="30" y="34" font-family="'DM Mono','Courier New',monospace" font-size="9" fill="#9d9185" letter-spacing="0.18em">ARKHE · SYSTEM ARCHITECTURE</text>

  <!-- ══════════ INGESTION BAND (offline) ══════════ -->
  <text x="30" y="58" font-family="'DM Mono','Courier New',monospace" font-size="8.5" fill="#566244" letter-spacing="0.14em">INGESTION PIPELINE — offline, on content change</text>

  <!-- I1 · Portfolio documents -->
  <rect x="30" y="70" width="200" height="58" rx="6" fill="#e2e7d6" stroke="#cdd3bc" stroke-width="1"/>
  <text x="130" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="11" font-weight="500" fill="#2f3a22">Portfolio documents</text>
  <text x="130" y="110" text-anchor="middle" font-family="'DM Mono','Courier New',monospace" font-size="8" fill="#5f6f48" letter-spacing="0.04em">projects · case studies</text>

  <line x1="230" y1="99" x2="284" y2="99" stroke="#c8c2ba" stroke-width="1.5"/>
  <polygon points="279,94 289,99 279,104" fill="#c8c2ba"/>

  <!-- I2 · Chunk + embed -->
  <rect x="290" y="70" width="200" height="58" rx="6" fill="#e2e7d6" stroke="#cdd3bc" stroke-width="1"/>
  <text x="390" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="11" font-weight="500" fill="#2f3a22">Chunk + embed</text>
  <text x="390" y="110" text-anchor="middle" font-family="'DM Mono','Courier New',monospace" font-size="8" fill="#5f6f48" letter-spacing="0.04em">paragraph-aware · 1536-dim</text>

  <line x1="490" y1="99" x2="544" y2="99" stroke="#c8c2ba" stroke-width="1.5"/>
  <polygon points="539,94 549,99 539,104" fill="#c8c2ba"/>

  <!-- I3 · Write vectors -->
  <rect x="550" y="70" width="200" height="58" rx="6" fill="#e2e7d6" stroke="#cdd3bc" stroke-width="1"/>
  <text x="650" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="11" font-weight="500" fill="#2f3a22">Write vectors</text>
  <text x="650" y="110" text-anchor="middle" font-family="'DM Mono','Courier New',monospace" font-size="8" fill="#5f6f48" letter-spacing="0.04em">batched inserts · upsert</text>

  <!-- write arrow down into store -->
  <line x1="650" y1="128" x2="650" y2="196" stroke="#8e9d75" stroke-width="1.5"/>
  <polygon points="645,191 650,201 655,191" fill="#8e9d75"/>
  <text x="662" y="166" font-family="'DM Mono','Courier New',monospace" font-size="7.5" fill="#8e9d75" letter-spacing="0.08em">write</text>

  <!-- ══════════ SHARED STORE ══════════ -->
  <rect x="120" y="202" width="540" height="96" rx="8" fill="#faf9f7" stroke="#d4cec8" stroke-width="1.25"/>
  <rect x="120" y="202" width="540" height="30" rx="8" fill="#f1eee9" stroke="none"/>
  <rect x="120" y="220" width="540" height="12" fill="#f1eee9" stroke="none"/>
  <text x="138" y="222" font-family="'DM Mono','Courier New',monospace" font-size="8.5" fill="#8f554d" letter-spacing="0.16em">SUPABASE PGVECTOR — shared knowledge store</text>

  <!-- Tile: documents -->
  <rect x="138" y="242" width="248" height="44" rx="5" fill="rgba(255,255,255,0.65)" stroke="#e0dad2" stroke-width="0.75"/>
  <text x="262" y="260" text-anchor="middle" font-family="'DM Mono','Courier New',monospace" font-size="7.5" fill="#5e554d" letter-spacing="0.1em">documents</text>
  <text x="262" y="276" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="8.5" font-weight="300" fill="#5f534a">chunks · vector(1536) · metadata</text>

  <!-- Tile: document_sources -->
  <rect x="394" y="242" width="248" height="44" rx="5" fill="rgba(255,255,255,0.65)" stroke="#e0dad2" stroke-width="0.75"/>
  <text x="518" y="260" text-anchor="middle" font-family="'DM Mono','Courier New',monospace" font-size="7.5" fill="#5e554d" letter-spacing="0.1em">document_sources</text>
  <text x="518" y="276" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="8.5" font-weight="300" fill="#5f534a">raw pre-chunk text · re-ingest</text>

  <!-- read connector up from runtime -->
  <line x1="330" y1="340" x2="330" y2="304" stroke="#bd8276" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="325,309 330,299 335,309" fill="#bd8276"/>
  <text x="342" y="326" font-family="'DM Mono','Courier New',monospace" font-size="7.5" fill="#bd8276" letter-spacing="0.08em">query ⇅ nearest chunks</text>

  <!-- ══════════ RUNTIME BAND (per request) ══════════ -->
  <text x="30" y="358" font-family="'DM Mono','Courier New',monospace" font-size="8.5" fill="#784a43" letter-spacing="0.14em">RUNTIME PIPELINE — per request, streamed</text>

  <!-- R1 · User question -->
  <rect x="30" y="370" width="130" height="60" rx="6" fill="#faf9f7" stroke="#d4cec8" stroke-width="1"/>
  <text x="95" y="395" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#17130f">User question</text>
  <text x="95" y="410" text-anchor="middle" font-family="'DM Mono','Courier New',monospace" font-size="7.5" fill="#9d9185" letter-spacing="0.04em">Request → Response</text>

  <line x1="160" y1="400" x2="190" y2="400" stroke="#c8c2ba" stroke-width="1.5"/>
  <polygon points="185,395 195,400 185,405" fill="#c8c2ba"/>

  <!-- R2 · Guards -->
  <rect x="196" y="370" width="130" height="60" rx="6" fill="#f2ddd7" stroke="#e9c8be" stroke-width="1"/>
  <text x="261" y="395" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#653a35">Guards</text>
  <text x="261" y="410" text-anchor="middle" font-family="'DM Mono','Courier New',monospace" font-size="7.5" fill="#8f554d" letter-spacing="0.04em">rate-limit · origin · size</text>

  <line x1="326" y1="400" x2="356" y2="400" stroke="#c8c2ba" stroke-width="1.5"/>
  <polygon points="351,395 361,400 351,405" fill="#c8c2ba"/>

  <!-- R3 · Embed + search -->
  <rect x="362" y="370" width="130" height="60" rx="6" fill="#f2ddd7" stroke="#e9c8be" stroke-width="1.25"/>
  <text x="427" y="395" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#653a35">Embed + search</text>
  <text x="427" y="410" text-anchor="middle" font-family="'DM Mono','Courier New',monospace" font-size="7.5" fill="#8f554d" letter-spacing="0.04em">match_documents</text>

  <line x1="492" y1="400" x2="522" y2="400" stroke="#c8c2ba" stroke-width="1.5"/>
  <polygon points="517,395 527,400 517,405" fill="#c8c2ba"/>

  <!-- R4 · Layered prompt -->
  <rect x="528" y="370" width="130" height="60" rx="6" fill="#faf9f7" stroke="#d4cec8" stroke-width="1"/>
  <text x="593" y="395" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#17130f">Layered prompt</text>
  <text x="593" y="410" text-anchor="middle" font-family="'DM Mono','Courier New',monospace" font-size="7.5" fill="#9d9185" letter-spacing="0.04em">persona + knowledge</text>

  <line x1="658" y1="400" x2="688" y2="400" stroke="#c8c2ba" stroke-width="1.5"/>
  <polygon points="683,395 693,400 683,405" fill="#c8c2ba"/>

  <!-- R5 · Stream reply -->
  <rect x="694" y="370" width="56" height="60" rx="6" fill="#653a35" stroke="#653a35" stroke-width="1"/>
  <text x="722" y="393" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="9.5" font-weight="500" fill="#faf9f7">Stream</text>
  <text x="722" y="407" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="9.5" font-weight="500" fill="#faf9f7">reply</text>
  <text x="722" y="421" text-anchor="middle" font-family="'DM Mono','Courier New',monospace" font-size="6.5" fill="#e9c8be" letter-spacing="0.02em">+ cites</text>

  <!-- ══════════ Caption ══════════ -->
  <text x="390" y="472" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="10" font-weight="300" fill="#76695f">Two pipelines, one store: ingestion writes embedded chunks; the runtime reads the nearest neighbours for each question.</text>
  <text x="390" y="490" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="9" font-weight="300" fill="#9d9185">If retrieval is unavailable, the runtime falls back to a curated knowledge base and still answers.</text>

</svg>
