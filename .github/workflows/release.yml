name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Pinned to 11.x, not `latest`. npm 12 changed `npm info --json` to return
      # an array, so @changesets/cli reads `.versions` off it as undefined and
      # concludes every package is unpublished — then fails the run trying to
      # republish over an existing version. npm 12 also rejects unknown CLI
      # flags outright. Trusted publishing (OIDC) needs >= 11.5.1, so 11.x is
      # the usable range until changesets supports npm 12.
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
