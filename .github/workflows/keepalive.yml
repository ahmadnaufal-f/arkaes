name: Supabase Keep-Alive

# Free-tier Supabase projects pause after 7 days of inactivity, and read-only
# queries do not reliably reset that timer. This runs a real write (upsert into
# `keepalive_heartbeat`) every 3 days, comfortably inside the window.
#
# Requires two repo secrets: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
#
# Note: GitHub disables scheduled workflows in repositories with no activity for
# 60 days. If the repo goes quiet, re-enable this from the Actions tab.

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write heartbeat
        run: pnpm keepalive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
